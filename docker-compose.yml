name: mini-restaurant-realtime

services:
# =====================================
# Postgres
# =====================================
  restaurant-postgres:
    image: postgres:16-alpine
    container_name: restaurant-postgres
    ports:
      - "${DB_PORT}:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - mini_restaurant_realtime_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - external_network
    restart: unless-stopped

  restaurant-minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: restaurant-minio
    command:
      - server
      - /data
      - --console-address
      - ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - restaurant_minio_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "mc",
          "ready",
          "local"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

# =====================================
# Volumes
# =====================================
volumes:
  mini_restaurant_realtime_postgres_data:
  restaurant_minio_data:
# =====================================
# Network
# =====================================
networks:
  external_network:
    driver: bridge